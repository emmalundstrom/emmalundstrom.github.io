<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>What's Your Wine?</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <p class="eyebrow">WEATHER × WINE</p>

    <h1>What's your<br> wine today?</h1>

    <p class="intro">
      Let the weather decide.
    </p>

    <button id="wineButton">
      Find my wine →
    </button>

   <section id="result" class="result">

  <p id="weather"></p>

  <div class="wine-card">

    <div class="bottle-wrapper">
      <img id="wineImage" src="" alt="Wine bottle">
    </div>

    <div class="wine-info">

      <p class="wine-label">TONIGHT'S PICK</p>

      <h2 id="wine"></h2>

      <p id="wineDetails"></p>

      <p id="reason"></p>

      <p id="wineRegion"></p>

    </div>

  </div>

</section> 

  </main>

  <script src="script.js"></script>

</body>
</html>
